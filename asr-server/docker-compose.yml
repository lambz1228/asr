# 本地基础设施：PostgreSQL + MinIO（S3 兼容对象存储）
# 用法：在 asr-server 目录执行 `docker compose up -d`
# 之后将 .env 中 DATABASE_URL 指向 postgres、STORAGE_BACKEND=s3 并填 MinIO 凭据。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asr
      POSTGRES_USER: asr
      POSTGRES_PASSWORD: asr_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
